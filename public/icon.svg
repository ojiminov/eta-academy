<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Graduation cap base (mortarboard) -->
  <polygon points="256,140 420,210 256,280 92,210" fill="white" opacity="0.95"/>
  <!-- Cap top -->
  <rect x="226" y="130" width="60" height="18" rx="4" fill="white"/>
  <!-- Left tassel string -->
  <path d="M420,210 L420,310" stroke="white" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <!-- Tassel ball -->
  <circle cx="420" cy="325" r="18" fill="#fbbf24"/>
  <!-- Diploma/book -->
  <rect x="175" y="295" width="162" height="110" rx="12" fill="white" opacity="0.15"/>
  <rect x="185" y="305" width="142" height="90" rx="8" fill="white" opacity="0.9"/>
  <!-- Lines on diploma -->
  <rect x="205" y="325" width="100" height="8" rx="4" fill="#c7d2fe"/>
  <rect x="205" y="343" width="80" height="7" rx="3.5" fill="#c7d2fe"/>
  <rect x="205" y="359" width="90" height="7" rx="3.5" fill="#c7d2fe"/>
  <!-- Seal -->
  <circle cx="295" cy="375" r="14" fill="#6366f1"/>
  <circle cx="295" cy="375" r="9" fill="white" opacity="0.8"/>
</svg>
